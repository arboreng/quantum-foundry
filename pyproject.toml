[project]
name = "quantum-foundry"
version = "0.1.0"
description = "Open-source implementations of quantum algorithms, documented and tested with production engineering rigor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "qiskit>=2.5,<3",
    "qiskit-aer>=0.17,<1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pylatexenc>=2.10",
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repository is a flat layout whose top level also holds documentation
# and placeholder directories (benchmarks/, docs/, hardware/, notebooks/,
# papers/, contrib/, visualization/) that contain no Python. List the
# shipped packages explicitly rather than relying on auto-discovery, which
# cannot tell them apart.
#
# validation/ is deliberately not shipped: it is a known-answer
# cross-validation harness for exercising this repository's own algorithms,
# so it is development tooling rather than library surface. The dependency
# runs one way — validation imports from algorithms, never the reverse — so
# omitting it leaves the published package self-contained.
[tool.hatch.build.targets.wheel]
packages = ["algorithms", "arithmetic", "compiler"]

# Leading slashes anchor to the project root, so "/README.md" does not also
# match the per-algorithm READMEs.
[tool.hatch.build.targets.sdist]
include = [
    "/algorithms",
    "/arithmetic",
    "/compiler",
    "/README.md",
    "/LICENSE",
]

# Tests and demo notebooks live inside the packages; they are part of the
# repository, not of the distributed artifact.
[tool.hatch.build]
exclude = ["**/tests", "**/notebooks", "**/*.ipynb"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "nbformat>=5.10.4",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["algorithms", "arithmetic", "compiler", "validation"]
addopts = "-m 'not slow'"
markers = [
    "slow: excluded by default (addopts); run explicitly with `pytest -m slow`",
]

# `pytest --cov` with no explicit target measures whatever happens to get
# imported, which silently counts the test files themselves toward the
# percentage. Scoping the measurement here makes the number mean "how much
# of the algorithm code is exercised" so that fail_under is a real invariant
# rather than a reflection of how thoroughly the tests test themselves.
[tool.coverage.run]
source = ["algorithms", "arithmetic", "compiler", "validation"]
omit = [
    # Reporting/plotting entry points: run by hand and by the benchmark
    # harness, not imported by the suite. Including them would measure
    # "are the benchmark scripts tested" rather than algorithm coverage.
    "*/benchmark.py",
    "*/visualization.py",
    "*/tests/*",
]

[tool.coverage.report]
# Measured baseline on the default (non-slow) suite is 94.5%. The floor sits
# a few points under it so that ordinary changes do not trip it, while a real
# coverage regression still fails CI. Raise it as the baseline rises; do not
# lower it to make a red build pass.
fail_under = 92
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
