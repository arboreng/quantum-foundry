[project]
name = "quantum-foundry"
version = "0.1.0"
description = "Open-source reference implementations of quantum algorithms, built with production engineering rigor."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "qiskit>=2.5,<3",
    "qiskit-aer>=0.17,<1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pylatexenc>=2.10",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "nbformat>=5.10.4",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["algorithms", "arithmetic", "compiler", "validation"]
addopts = "-m 'not slow'"
markers = [
    "slow: excluded by default (addopts); run explicitly with `pytest -m slow`",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
