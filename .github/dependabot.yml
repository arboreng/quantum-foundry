version: 2

updates:
  # CI pins every action by commit SHA rather than by tag, which is the right
  # default for a public repository — a tag can be moved, a SHA cannot. The
  # cost of that choice is that a pinned SHA never picks up a security fix on
  # its own, so it needs something watching it. This is that something.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"

  # uv.lock is committed and CI installs with `uv sync --locked`, so the lock
  # file is the single source of truth for what actually gets built and tested.
  # Grouping the non-major updates keeps that from turning into a steady drip
  # of one-line PRs; majors stay separate because qiskit in particular gates
  # on a `<3` constraint that a human should look at before it moves.
  #
  # lockfile-only stops Dependabot from also raising the lower bounds declared
  # in pyproject.toml. Its default is to lift each floor to whatever version it
  # just resolved, which quietly narrows the set of environments the repository
  # runs in — the first such PR proposed matplotlib>=3.8 -> >=3.11.1 with no
  # motivation beyond 3.11.1 being current. The floors state the oldest version
  # the code is known to work against, which is a claim about compatibility that
  # only a human should change.
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: lockfile-only
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
