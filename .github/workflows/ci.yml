name: CI

on:
  push:
    branches: [main]
  pull_request:

  # Push and pull_request only prove the suite passed against the dependency
  # versions available on the day someone happened to commit. A repository that
  # goes quiet for a month has no signal at all in between, and the things most
  # likely to break here break without anyone touching the code: a new Python
  # 3.14 patch release, a qiskit release inside the `<3` constraint, or a
  # transitive dependency moving under a lock file that Dependabot's
  # lockfile-only strategy deliberately leaves alone.
  schedule:
    # Mondays, 06:17 UTC. Deliberately off the hour: scheduled jobs cluster at
    # :00 and GitHub drops runs it cannot service during a spike.
    - cron: "17 6 * * 1"

  # Lets the same matrix be run on demand without an empty commit, which is
  # what you want when investigating whether a failure is real or transient.
  workflow_dispatch:

# Pull requests from forks trigger this workflow, so the token it runs with is
# reachable by anyone who can open a PR. Nothing here writes to the repository
# — it checks out, installs, and runs the suite — so read access to contents is
# the whole requirement. Declaring it explicitly also stops the job from
# silently widening if the repository-level default is ever loosened.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # pyproject.toml declares requires-python = ">=3.12,<3.15", so every
    # version in that range is exercised rather than only the lowest or
    # the newest. A support claim without CI evidence behind it is a guess.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    name: test (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      - name: Test
        run: uv run pytest --cov

      - name: Execute notebooks
        run: uv run python scripts/execute_notebooks.py
