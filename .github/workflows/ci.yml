name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks trigger this workflow, so the token it runs with is
# reachable by anyone who can open a PR. Nothing here writes to the repository
# — it checks out, installs, and runs the suite — so read access to contents is
# the whole requirement. Declaring it explicitly also stops the job from
# silently widening if the repository-level default is ever loosened.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # pyproject.toml declares requires-python = ">=3.12,<3.15", so every
    # version in that range is exercised rather than only the lowest or
    # the newest. A support claim without CI evidence behind it is a guess.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    name: test (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      - name: Test
        run: uv run pytest --cov

      - name: Execute notebooks
        run: uv run python scripts/execute_notebooks.py
